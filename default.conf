# www -> apex, 301.
#
# www.giniloh.com resolves to this box, so without this block the host has no router and no
# certificate: https://www.giniloh.com fails the TLS handshake (Traefik serves its default,
# self-signed cert) and http://www.giniloh.com 404s. On the primary property that is a browser
# security error for anyone who types the www form of the domain.
#
# The Location is absolute on purpose: it must land on https regardless of the scheme and host the
# reader arrived on. Traefik routes www to this same container, so nginx is where the 301 happens.
server {
    listen 80;
    server_name www.giniloh.com;
    return 301 https://giniloh.com$request_uri;
}

server {
    listen 80;
    # The real host is named explicitly; `localhost` stays for Coolify's health probe, which arrives
    # with no meaningful Host header. www is NOT listed here — it has its own block above, and a
    # hostname in two server_name lists makes nginx pick one at random.
    server_name giniloh.com localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Behind Traefik: emit RELATIVE Location headers.
    # Without this, `return 301 /about/` becomes `Location: http://giniloh.com/about/` — nginx builds
    # an absolute URL out of its own listen port and scheme, and Traefik is the thing terminating
    # TLS. The reader is downgraded to plain http and bounced back to https by the redirect-scheme
    # middleware: two hops and one insecure request for every redirect on the site.
    absolute_redirect off;

    # 301 map for the 86 articles + 2 tool pages that moved to aichieve.net in the 2026 split.
    # Generated from src/data/ownership.mjs by scripts/generate-nginx-redirects.mjs at image
    # build time, and included here rather than dropped in conf.d/ — nginx auto-includes
    # conf.d/*.conf at the HTTP level, where a bare `location` is a syntax error.
    # These are exact matches, so they win over the static redirect stubs Astro also emits.
    include /etc/nginx/redirects.conf;

    # 1. 301 Redirect dated WordPress URLs (e.g. /2026/06/06/slug/ -> /slug/)
    location ~* '^/\d{4}/\d{2}/\d{2}/([^/]+)/?$' {
        return 301 /$1/;
    }

    # 2. 301 Redirect legacy WordPress pages
    location ~* '^/home/about-us/?$' {
        return 301 /about/;
    }
    location ~* '^/home/career/?$' {
        return 301 /calculators/career-ai-resilience/;
    }
    location ~* '^/tutorials/(coffee-beans|espresso-dial-in)/?$' {
        return 301 /calculators/coffee-arbitrage/;
    }
    location ~* '^/(apps|showcase|pro-apps)/?$' {
        return 301 https://apps.aichieve.net/showcase;
    }

    # 3. Cache hashed static assets
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 4. Proxy ALL WordPress Backend paths
    location ~* '^/(wp-content|wp-includes|wp-json|wp-admin|wp-login\.php|wp-cron\.php)' {
        proxy_pass https://cms.giniloh.com;
        proxy_set_header Host cms.giniloh.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # 5. Direct 404 route handling
    location ~* '^/404/?$' {
        return 404;
    }

    # 6. Handle Astro Subpages and Static Files
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 7. Proper 404 status handling
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
